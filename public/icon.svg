<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-8 -4 116 116">
  <!-- App icon: the crowned crest from DragonSprite (stage 4), with the dark
       theme's colours written out because an icon has no CSS variables.
       Full-bleed background, no transparency: iOS fills transparent pixels
       with black and rounds the corners itself. The horns reach past the
       maskable safe zone, so the manifest lists these as purpose "any" only.
       Source for icon.png and apple-touch-icon.png (scripts/make-icons.mjs). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#271610"/>
      <stop offset="100%" stop-color="#0A0603"/>
    </radialGradient>
    <linearGradient id="scales" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4958A"/>
      <stop offset="55%" stop-color="#C27B6E"/>
      <stop offset="100%" stop-color="#9A5E53"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#E8C870" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#E8C870" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E8C870" stop-opacity="0"/>
    </radialGradient>
    <g id="half">
      <path d="M 33 28 Q 16 22 3 26 Q 15 20 22 8 Q 26 20 38 25 Z" fill="#E8C870" stroke="#9A5E53" stroke-width="1" stroke-linejoin="round"/>
      <path d="M 26 41 Q 12 44 2 40 Q 15 41 24 33 Z" fill="#E8C870" opacity="0.85" stroke="#9A5E53" stroke-width="0.8" stroke-linejoin="round"/>
      <path d="M 25 42 L 44 47" stroke="#9A5E53" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
      <path d="M 22 50 l -9 -4 l 8 9 M 26 62 l -9 3 l 9 4" stroke="#E8C870" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="45" cy="73" rx="2.4" ry="1.7" fill="#9A5E53" opacity="0.85"/>
      <path d="M 42 80 L 46 80 L 44 88 Z" fill="#271610"/>
    </g>
  </defs>

  <rect x="-8" y="-4" width="116" height="116" fill="url(#bg)"/>
  <circle cx="50" cy="52" r="46" fill="url(#glow)"/>

  <path d="M 50 21 L 31 27 L 20 44 L 26 61 L 39 70 L 41 84 L 50 89 L 59 84 L 61 70 L 74 61 L 80 44 L 69 27 Z" fill="url(#scales)" stroke="#9A5E53" stroke-width="1.3" stroke-linejoin="round"/>
  <use href="#half" xlink:href="#half"/>
  <use href="#half" xlink:href="#half" transform="translate(100 0) scale(-1 1)"/>

  <path d="M 26 48 L 43 53 L 40 59 L 27 55 Z" fill="#E8C870"/>
  <path d="M 74 48 L 57 53 L 60 59 L 73 55 Z" fill="#E8C870"/>
  <circle cx="34" cy="54" r="1.5" fill="#0F0906" opacity="0.85"/>
  <circle cx="66" cy="54" r="1.5" fill="#0F0906" opacity="0.85"/>

  <path d="M 34 22 L 39 10 L 45 17 L 50 5 L 55 17 L 61 10 L 66 22 Z" fill="#C9A84C" stroke="#B8943E" stroke-width="1.1" stroke-linejoin="round"/>
  <circle cx="50" cy="15" r="2" fill="#E8C870"/>

  <ellipse cx="50" cy="94" rx="8" ry="4.2" fill="#E8C870" opacity="0.7"/>
  <ellipse cx="50" cy="94" rx="4" ry="2.2" fill="#271610" opacity="0.6"/>
</svg>
